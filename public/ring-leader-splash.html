<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Ring Leader — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&amp;family=Libre+Caslon+Text:ital@0;1&amp;family=Spectral:ital,wght@0,300;0,400;0,600&amp;family=Archivo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0F1A31;
    color: #FBF7EC;
    font-family: Spectral, Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    /* Layered lighting — warm gold uplight, cool navy sink, faint paper grain */
    background-image:
      radial-gradient(ellipse 60% 40% at 50% 22%, rgba(217,163,43,0.16), transparent 70%),
      radial-gradient(ellipse 90% 60% at 50% 110%, rgba(0,0,0,0.55), transparent 60%),
      radial-gradient(circle at 0% 0%, rgba(255,255,255,0.02), transparent 40%);
    background-color: #0F1A31;
    position: relative;
    overflow: hidden;
  }
  /* Fine noise/grain for that printed-page feel */
  body::before {
    content:"";
    position: fixed; inset: 0;
    pointer-events: none;
    opacity: .04;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 20px;
  }

  .eyebrow {
    font-family: Archivo, sans-serif;
    font-size: 10.5px;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: #C79A3C;
  }

  /* Masthead ornament — thin hairline, small SVG fleuron, thin hairline */
  .ornament {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 360px;
    margin: 4px 0 -2px;
  }
  .ornament .line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(217,163,43,0.55) 50%, transparent);
  }
  .ornament svg { width: 26px; height: 12px; color: #D9A32B; flex: none; }

  h1 {
    margin: 0;
    font-family: 'Libre Caslon Display', Georgia, serif;
    font-weight: 400;
    font-size: 68px;
    line-height: .96;
    color: #FBF7EC;
    letter-spacing: -0.01em;
  }
  h1 .gold {
    color: #D9A32B;
    font-style: italic;
  }

  .issue {
    font-family: 'Libre Caslon Text', Georgia, serif;
    font-style: italic;
    font-size: 15px;
    color: #93A0BB;
    letter-spacing: .02em;
  }

  .lede {
    margin-top: 10px;
    font-size: 16.5px;
    line-height: 1.55;
    font-weight: 300;
    color: #C6CFDF;
    max-width: 400px;
    text-wrap: pretty;
  }
  .lede strong { color: #FBF7EC; font-weight: 600; }

  .google-btn {
    margin-top: 10px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: #FBF7EC;
    color: #16233F;
    font-family: Archivo, sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: .02em;
    padding: 13px 24px;
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 2px;
    text-decoration: none;
    transition: background-color .15s ease, transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .google-btn:hover {
    background: #FFFFFF;
    transform: translateY(-1px);
    box-shadow: 0 14px 34px rgba(0,0,0,0.48);
  }
  .google-btn:active { transform: translateY(0); }
  .google-btn svg { width: 20px; height: 20px; flex: none; }

  .note {
    margin-top: 2px;
    font-family: Archivo, sans-serif;
    font-size: 10.5px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: #6D7A94;
  }

  .footer {
    position: fixed;
    bottom: 20px;
    left: 0; right: 0;
    text-align: center;
    font-family: Archivo, sans-serif;
    font-size: 10px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: #3F4C68;
  }

  @media (max-width: 520px) {
    h1 { font-size: 46px; }
    .eyebrow { font-size: 9.5px; letter-spacing: .28em; }
    .lede { font-size: 15.5px; }
    .google-btn { font-size: 14px; padding: 12px 22px; }
    .footer { position: static; margin-top: 28px; }
    .stage { gap: 18px; }
  }
  @media (max-width: 360px) {
    h1 { font-size: 38px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="eyebrow">Answering Legal &nbsp;·&nbsp; Monthly Leadership Slack Blast</div>

  <div class="ornament" aria-hidden="true">
    <div class="line"></div>
    <!-- Small fleuron / arrow ornament, hand-drawn feel -->
    <svg viewBox="0 0 60 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 6h20" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M40 6h20" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M30 1.5l4 4.5-4 4.5-4-4.5 4-4.5z" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round"/>
    </svg>
    <div class="line"></div>
  </div>

  <h1>The Ring <span class="gold">Leader</span></h1>

  <div class="issue">Issue №1 &nbsp;·&nbsp; July 2026</div>

  <div class="lede">Sign in with your <strong>Answering Legal</strong> Google account to read this month's issue.</div>

  <a class="google-btn" href="/auth/google?returnTo=/ring-leader">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    <span>Sign in with Google</span>
  </a>

  <div class="note">@answeringlegal.com accounts only</div>
</div>

<div class="footer">The Ring Leader &nbsp;·&nbsp; Answering Legal &nbsp;·&nbsp; MMXXVI</div>

</body>
</html>
